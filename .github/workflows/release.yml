# Builds FrobTADS (frob) for the Asciiverse catalog and as system packages.
#
# For av: one archive per target, named frobtads-<target>.tar.gz, plus a
# SHA256SUMS file, attached to a GitHub release (hub/catalog/SCHEMA.md,
# release.source = "github").
# For everyone else: .deb, .rpm, .apk and Arch packages from the same static
# Linux binary, made by nfpm (asciiverse/nfpm.yaml).
#
# Tags look like v2.0-av.1: upstream's version, then our packaging release.
# Every build runs asciiverse/build-frobtads.sh, the same script the story
# titles use: it clones upstream's v2.0 and applies our fixes, and the Linux
# x86_64 job checks that the result is identical to this checkout. Linux:
# fully static in Alpine. macOS: both architectures on one runner, linking
# only the system's ncurses. No Windows build: frob's curses interface is
# for Unix terminals.

name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "existing tag to build and release"
        required: true

env:
  ID: frobtads
  BIN: frob
  TAG: ${{ inputs.tag || github.ref_name }}

permissions:
  contents: write

jobs:
  linux:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: x86_64-unknown-linux-musl, runner: ubuntu-24.04, arch: amd64 }
          - { target: aarch64-unknown-linux-musl, runner: ubuntu-24.04-arm, arch: arm64 }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      - name: Build
        run: |
          docker run --rm -v "$PWD":/src -w /src alpine:3.22 sh asciiverse/build-frobtads.sh
          sudo chown -R "$(id -u):$(id -g)" .
          file "build/$BIN"

      - name: Same source as this repository
        if: matrix.arch == 'amd64'
        run: |
          diff -r -q --exclude=.git --exclude=.github --exclude=asciiverse \
            --exclude=build --exclude=PATCHES.md --exclude=CLAUDE.md --exclude=.gitignore \
            build/frobtads-src .

      - name: Smoke test
        run: |
          "build/$BIN" --version | head -3

      - name: Package for av
        run: |
          # the binary sits at the top of the archive, where av looks for it
          mkdir -p stage dist
          cp build/frob build/COPYING build/LICENSE.TADS2 build/LICENSE.TADS3 build/NOTICE stage/
          tar -czf "dist/$ID-${{ matrix.target }}.tar.gz" -C stage .

      - name: System packages
        run: |
          v="${TAG#v}"; export VERSION="${v%%-av.*}" RELEASE="${v##*-av.}" ARCH="${{ matrix.arch }}"
          for p in deb rpm apk archlinux; do
            docker run --rm -u "$(id -u):$(id -g)" -v "$PWD":/src -w /src \
              -e VERSION -e RELEASE -e ARCH goreleaser/nfpm:v2.43.0 \
              package --config asciiverse/nfpm.yaml --packager "$p" --target dist/
          done
          ls -l dist

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: dist/*

  macos:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: x86_64-apple-darwin, arch: x86_64 }
          - { target: aarch64-apple-darwin, arch: arm64 }
    runs-on: macos-15
    env:
      MACOSX_DEPLOYMENT_TARGET: "11.0"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      - name: Build
        run: CC_ARCH=${{ matrix.arch }} sh asciiverse/build-frobtads.sh

      - name: Smoke test
        if: matrix.arch == 'arm64'
        run: build/frob --version | head -3

      - name: Package
        run: |
          mkdir -p stage dist
          cp build/frob build/COPYING build/LICENSE.TADS2 build/LICENSE.TADS3 build/NOTICE stage/
          tar -czf "dist/$ID-${{ matrix.target }}.tar.gz" -C stage .

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: dist/*

  release:
    needs: [linux, macos]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Checksums
        working-directory: dist
        run: sha256sum * > SHA256SUMS && cat SHA256SUMS

      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1 \
            || gh release create "$TAG" -R "$GITHUB_REPOSITORY" --title "FrobTADS $TAG" \
                 --notes "FrobTADS ${TAG%%-av.*} from github.com/realnc/frobtads, built for the Asciiverse catalog, with .deb, .rpm, .apk and Arch packages. Free of charge only: the TADS licences forbid selling it or bundling it with anything sold. Changes from upstream: see PATCHES.md."
          gh release upload "$TAG" dist/* -R "$GITHUB_REPOSITORY" --clobber
